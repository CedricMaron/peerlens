[project]
name = "peerlens"
version = "1.0.0"
description = "AI-assisted scientific research quality control."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
peerlens = "peerlens.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["peerlens*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests", "../evals"]

[tool.ruff]
line-length = 100
target-version = "py311"
