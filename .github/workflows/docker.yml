name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build the image to prove it still builds, but publish
      # nothing: a fork must never be able to push to the registry.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the image actually runs, rather than merely compiling.
      - name: Smoke-test the image
        run: |
          docker build -t peerlens:smoke .
          docker run -d --name peerlens-smoke -p 8000:8000 \
            -v peerlens-smoke-data:/app/data peerlens:smoke

          echo "Waiting for the API to become healthy..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /tmp/health.json 2>/dev/null; then
              echo "Healthy after ${i}s:"; cat /tmp/health.json; echo; break
            fi
            if [ "$i" = "30" ]; then
              echo "API never became healthy. Container logs:"
              docker logs peerlens-smoke
              exit 1
            fi
            sleep 1
          done

          # Data must live in the mounted volume, or research is lost on upgrade.
          test "$(jq -r .data_dir /tmp/health.json)" = "/app/data"

          # The compiled frontend must be served from the same port as the API.
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          echo "Frontend served."

          # The scientific prompts must be present in the image at runtime.
          docker exec peerlens-smoke sh -c 'test -f /app/prompts/checklist/hypothesis/review.md'
          test "$(docker exec peerlens-smoke sh -c 'ls /app/prompts/checklist/*/*.md | wc -l')" = "22"
          echo "All 22 checklist prompts present."

          # The database must be created inside the volume and survive a restart.
          docker exec peerlens-smoke sh -c 'test -f /app/data/peerlens.db'
          BRANCH=$(curl -fsS -X POST http://localhost:8000/api/branches \
            -H 'Content-Type: application/json' \
            -d '{"name":"smoke-test branch"}' | jq -r .id)
          docker restart peerlens-smoke
          sleep 8
          curl -fsS http://localhost:8000/api/branches | jq -e \
            --arg id "$BRANCH" '[.[] | select(.id == ($id|tonumber))] | length == 1'
          echo "Research data survived a container restart."

          docker rm -f peerlens-smoke
          docker volume rm peerlens-smoke-data
